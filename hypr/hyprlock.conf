# Fingerprint unlock needs fprintd and an enrolled finger (fprintd-enroll).
# Machines without a reader fall back to the password field.

general {
    hide_cursor = true
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Scanning...
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = SauceCodePro Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    font_size = 14
    font_family = SauceCodePro Nerd Font
    position = 0, -80
    halign = center
    valign = center
}
