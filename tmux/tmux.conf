##### Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Quality-of-life
set -g mouse on
set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

##### TPM + persistence
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Herdr owns its workspace and agent state. Resurrect only needs to restore
# the outer tmux layout and relaunch the Herdr client.
set -gu @resurrect-hook-pre-restore-pane-processes
set -g @resurrect-processes 'herdr'

# Persist each tmux-project server independently. The scripts obtain this
# server's @resurrect-dir, so snapshots never cross project boundaries.
set -g @tmux-project-autosave-interval 15
set-hook -g client-detached 'run-shell -b "~/.tmux/scripts/tmux_project_save.sh #{socket_path}"'
run-shell -b '~/.tmux/scripts/tmux_project_autosave.sh "#{socket_path}" "#{start_time}"'

##### Splits (your requested keys)
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"   # horizontal split (top/bottom)
bind -n C-S-Enter split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"   # vertical split (left/right)

##### New "tab" (tmux window)
bind t new-window -c "#{pane_current_path}"

##### Pane navigation
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R
# alt-arrows option
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

##### Window (tab) navigation (no prefix)
bind -n S-Left  previous-window
bind -n S-Right next-window

#### Kill pane with ctrl-w
bind -n C-w confirm-before -p "Kill pane? (y/n)" kill-pane

##### Window navigation
unbind [
unbind ]
bind [ previous-window
bind ] next-window

##### Pane titles (stable identity for codex mapping)
bind n command-prompt -p "Pane title:" "select-pane -T '%%'"
bind N display-message "pane_title=#{pane_title}"
bind , command-prompt -I "#{window_name}" -p "Window name:" "rename-window '%%'"

##### ---- Codex: tmux-screen based sync ----
set -g @codex_enter_delay "0.20"    # delay before pressing Enter after typing command
set -g @codex_render_delay "0.45"   # delay after Enter to let /status render before capture

# Helper: /status then capture+store session UUID
bind s run-shell ' \
  d1="$(tmux show -gqv @codex_enter_delay)"; \
  d2="$(tmux show -gqv @codex_render_delay)"; \
  tmux send-keys -t "#{pane_id}" -l "/status"; \
  sleep "$d1"; \
  tmux send-keys -t "#{pane_id}" C-m; \
  sleep "$d2"; \
  codex-sync "#{pane_id}" \
'

# Helper: /new then /status then capture+store session UUID
bind u run-shell ' \
  d1="$(tmux show -gqv @codex_enter_delay)"; \
  d2="$(tmux show -gqv @codex_render_delay)"; \
  tmux send-keys -t "#{pane_id}" -l "/new"; \
  sleep "$d1"; \
  tmux send-keys -t "#{pane_id}" C-m; \
  sleep 0.15; \
  tmux send-keys -t "#{pane_id}" -l "/status"; \
  sleep "$d1"; \
  tmux send-keys -t "#{pane_id}" C-m; \
  sleep "$d2"; \
  codex-sync "#{pane_id}" \
'

# Optional convenience: start/resume codex for this pane (uses codex-launch)
bind C run-shell 'tmux send-keys -t "#{pane_id}" -l "codex-launch"; sleep "$(tmux show -gqv @codex_enter_delay)"; tmux send-keys -t "#{pane_id}" C-m'

##### Foocolors tmux theme
source-file ~/.tmux/foocolors.conf

run-shell '~/.tmux/plugins/tpm/tpm'
